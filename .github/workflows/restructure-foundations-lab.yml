name: Restructure Foundations Lab

on:
  push:
    branches:
      - restructure-foundations-lab

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restructure-foundations-lab
      - name: Rebuild Programming Logic Foundations Lab
        run: |
          base64 -d .bootstrap/generate_lab.py.gz.b64 | gzip -d > /tmp/generate_lab.py
          python /tmp/generate_lab.py --key pl
          rm -f .curriculum-source.md.gz.b64
          rm -f .github/workflows/restructure-foundations-lab.yml
      - name: Commit restructured Lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: restructure Programming Logic Foundations Lab" || exit 0
          git push origin HEAD:restructure-foundations-lab
